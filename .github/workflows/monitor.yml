name: Benjamin Cowen YouTube monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: benjamin-cowen-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install caption downloader
        run: python -m pip install --disable-pip-version-check --quiet yt-dlp youtube-transcript-api

      - name: Diagnose caption API
        run: |
          python - <<'PY'
          from youtube_transcript_api import YouTubeTranscriptApi
          try:
              snippets = YouTubeTranscriptApi().fetch("VWU9sgbvnzw", languages=["en"])
              print(f"caption_api_chars={sum(len(snippet.text) for snippet in snippets)}")
          except Exception as error:
              print(f"caption_api_error={type(error).__name__}: {error}")
          PY

      - name: Check for new video and send summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEND_LATEST_ON_FIRST_RUN: "true"
          GEMINI_MODEL: gemini-3.5-flash-lite
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Save upload state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Benjamin Cowen monitor state"
            git push
          fi
