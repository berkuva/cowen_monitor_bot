name: Benjamin Cowen YouTube monitor

on:
  workflow_dispatch:
  schedule:
    # Poll every five minutes, offset from the hour to reduce GitHub scheduler congestion.
    - cron: "3-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: benjamin-cowen-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ARCHIVE_CONFIGURED: ${{ secrets.ARCHIVE_DEPLOY_KEY != '' }}
      ARCHIVE_PATH: private-archive
    steps:
      - name: Check out state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install caption downloader
        run: python -m pip install --disable-pip-version-check --quiet yt-dlp youtube-transcript-api

      - name: Check out private dataset
        id: archive
        if: env.ARCHIVE_CONFIGURED == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: berkuva/cowen_video_archive
          ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
          path: private-archive

      - name: Check for new video and send summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEND_LATEST_ON_FIRST_RUN: "true"
          GEMINI_MODEL: gemini-3.5-flash-lite
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Save upload state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Benjamin Cowen monitor state"
            git push
          fi

      - name: Resume 2026 transcript backfill (no historical emails)
        if: success() && steps.archive.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: python backfill.py run --archive private-archive --year 2026 --batch-size 3

      - name: Save private transcripts and email records
        if: always() && steps.archive.outcome == 'success'
        working-directory: private-archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Archive Cowen source records and transcript progress"
            git push
          fi
